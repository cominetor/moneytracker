name: Deploy su GitHub Pages

on:
  push:
    branches:
      - main
      - claude/portfolio-tracker-webapp-vvv30d
  # aggiorna le quotazioni statiche ogni 15 minuti
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # le quotazioni vengono recuperate qui, dove non esistono limiti CORS,
      # e finiscono in public/prices.json servito insieme all'app
      - name: Aggiorna quotazioni azionarie
        run: node scripts/fetch-prices.mjs
        env:
          # facoltativo: se il secret non esiste la fonte viene semplicemente saltata
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

      - run: npm run build

      # Richiede che Pages sia gia' attivo sul repo con source "GitHub Actions":
      # il GITHUB_TOKEN del workflow non ha il permesso di crearlo da solo.
      - name: Configura Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su Pages
        id: deployment
        uses: actions/deploy-pages@v4
